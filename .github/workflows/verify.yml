name: verify
on: push
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: flutter analyze lib/core/association lib/ui/widgets/settings_dialog.dart lib/ui/widgets/associations_tab.dart lib/main.dart test/association_plan_test.dart
      - run: flutter test test/association_plan_test.dart
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true
