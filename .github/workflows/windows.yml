name: Windows validation

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: 'Optional existing commit to check for pre-existing test failures'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # README's supported toolchain is Visual Studio 2022. The vendored WebView
    # plugin still uses /await, which the newer windows-latest compiler rejects.
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Install dependencies
        id: dependencies
        run: ./.github/scripts/flutter-check.ps1 pub get --enforce-lockfile
      - name: Analyze
        run: ./.github/scripts/flutter-check.ps1 analyze
      - name: Test Info
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: ./.github/scripts/flutter-check.ps1 test --reporter expanded test/info_collector_test.dart test/info_controller_test.dart test/info_panel_test.dart
      - name: Test right-click layer
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: ./.github/scripts/flutter-check.ps1 test --reporter expanded test/right_menu_test.dart
      - name: Test full suite
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: ./.github/scripts/flutter-check.ps1 test --reporter expanded

  build:
    needs: validate
    if: ${{ !cancelled() }}
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Install dependencies
        run: ./.github/scripts/flutter-check.ps1 pub get --enforce-lockfile
      - name: Build Windows release
        run: ./.github/scripts/flutter-check.ps1 build windows --release --no-pub

  baseline:
    # Temporary review run; removed after the comparison is recorded.
    if: ${{ !cancelled() }}
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.baseline_ref || '1273e1f81f2f531f47b2cbaf2d9b9c9f91cc2fbb' }}
          path: baseline
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Install baseline dependencies
        working-directory: baseline
        run: ../.github/scripts/flutter-check.ps1 pub get --enforce-lockfile
      - name: Test baseline full suite
        working-directory: baseline
        run: ../.github/scripts/flutter-check.ps1 test --reporter expanded
