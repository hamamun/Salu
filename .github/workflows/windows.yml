name: Windows validation

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # Pin the stable SDK compatible with the locked vector_math/test packages.
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Install dependencies
        id: dependencies
        run: ./.github/scripts/flutter-check.ps1 pub get --enforce-lockfile
      - name: Analyze
        run: ./.github/scripts/flutter-check.ps1 analyze
      - name: Test
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: ./.github/scripts/flutter-check.ps1 test --reporter expanded
      - name: Build Windows release
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: ./.github/scripts/flutter-check.ps1 build windows --release --no-pub
