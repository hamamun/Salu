name: salu_remote
description: "SALU Remote — control SALU on your PC from your phone over your own Wi-Fi."
publish_to: "none"
version: 0.1.0+1

# This file is the SALU repo's copy. In the APK repository, keep YOUR resolved
# versions of the two plugins (see README §1) — only the code in lib/ must match
# this folder.
environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── The only two plugins ────────────────────────────────────────────────
  # QR scanning for pairing (D2). Camera only; no file access, no barcode zoo.
  mobile_scanner: ^5.2.3
  # Remembered PC (host/port/device token) + UI preferences.
  shared_preferences: ^2.3.0

  # Everything else — the WebSocket, the JSON, the crypto-free token storage —
  # is dart:io / dart:convert, so there is no third plugin to break on an SDK
  # bump. Deliberate: the wire protocol is the one thing that must not drift.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # No assets. Every icon is a CustomPainter (remote_apk_ui.md §9) so both
  # halves of SALU draw identical marks and the APK ships no images.
