name: salu
description: "SALU — A modern,  -inspired media player for Windows."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── Phase 1: Foundation & Window Framework ──────────────────────────────
  # Borderless window, hidden native title bar, drag-to-move, min/max/close.
  # (APIs verified compatible across 0.4.x–0.5.x.)
  window_manager: ">=0.4.3 <0.6.0"
  # Strict single-instance enforcement + file argument forwarding.
  windows_single_instance: ^1.0.1

  # ── Phase 2: Core Media Engine ──────────────────────────────────────────
  # The holy trinity of media_kit (libmpv wrapper).
  media_kit: ^1.1.11 # Core playback logic.
  media_kit_video: ">=1.2.5 <3.0.0" # The Video widget that renders frames.
  media_kit_libs_video: ^1.0.5 # Native Windows libmpv-2.dll binaries.
  # Drag & drop of local media files onto the window.
  # (APIs verified compatible across 0.4.x–0.8.x.)
  desktop_drop: ">=0.4.4 <0.9.0"

  # ── Open Media control ───────────────────────────────────────────────────
  # Native Windows explorer dialogs (Open File… / Open Folder…). The
  # flutter.dev-maintained picker — its Windows backend is pure C++, so it
  # adds no Dart-side win32 version constraints.
  file_selector: ^1.0.3

  # ── Subtitles (cc.md §4) ────────────────────────────────────────────────
  # OpenSubtitles REST v1 — search / login / download. Pure Dart, no
  # native glue (already in the dependency graph as media_kit's own HTTP
  # client, locked at 1.6.0).
  http: ^1.2.0

  # ── Audio display (lrc.md L21) ──────────────────────────────────────────
  # Cover-art bytes (ID3 APIC / FLAC picture / MP4 covr). Audio metadata
  # fields come from mpv; this package is used for embedded artwork.
  audio_metadata_reader: ^1.4.0

  # ── Phase 9 · Mini bar mode (mini.md §2) ────────────────────────────────
  # Display geometry for the bar's remembered point: the ONLY query that
  # answers with each monitor's origin as well as its size, which is what
  # "clamped inside the visible screen (multi-monitor + DPI safe)" needs.
  # Already in the tree as window_manager's own dependency; declared here
  # because SALU now calls it directly.
  screen_retriever: ^0.2.2

  # ── Settings & persistence ──────────────────────────────────────────────
  # Lightweight key-value storage for settings (title bar mode, …).
  shared_preferences: ^2.3.0

  # ── Phase 6: built-in web browser (web.md) ──────────────────────────────
  # SALU's browser wraps the WebView2 runtime every Windows 10/11 already
  # ships — SALU never bundles its own browser engine. The package talks to
  # the system Edge/Chromium through `WebView2Loader.dll`; when the runtime
  # is missing, tab startup fails per-tab and the browser stays on its
  # start page (never crashes the player).
  #
  # VENDORED (third_party/webview_windows, see its VENDOR_NOTES.md): the
  # upstream 0.4.0 plugin plus two additions — the engine's own profile
  # PreferredColorScheme control, which Settings → Web → Page colours
  # drives (what `prefers-color-scheme` answers; the same control Edge's
  # Appearance setting uses), and the DownloadStarting deferral
  # round-trip behind "Ask where to save". Upstream has neither API, and
  # command-line flags are not a supported WebView2 configuration path.
  webview_windows:
    path: third_party/webview_windows

  # Utilities.
  path: ^1.9.0
  # LAN remote pairing: SHA-256 token hashes and QR payload rendering.
  crypto: ^3.0.6
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # NOTE ON TYPOGRAPHY:
  # SALU strictly uses "Segoe UI Variable". It ships with Windows 11 as a
  # system font, so we reference it by family name in the ThemeData instead
  # of bundling the (non-redistributable) font file. On Windows 10 the theme
  # gracefully falls back to classic "Segoe UI" via fontFamilyFallback.
